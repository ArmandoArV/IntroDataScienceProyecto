project:
  type: default

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    self-contained: true
    fig-width: 10
    fig-height: 6

execute:
  enabled: false   # use pre-executed notebook outputs; no dataset re-execution in CI
  freeze: auto

jupyter: python3
