name: Publish to GitHub Pages

on:
  push:
    branches: ["armandoav/finalNotebook"]
    paths:
      - "MainNotebook.ipynb"
      - "_quarto.yml"
      - "requirements.txt"
      - ".github/workflows/publish-quarto.yml"
  workflow_dispatch:   # allow manual trigger from GitHub Actions UI

permissions:
  contents: write   # needed to push to gh-pages branch

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"

      - name: Render notebook to HTML
        run: quarto render MainNotebook.ipynb --no-execute --to html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          include_files: MainNotebook.html
          destination_dir: .
          # Rename to index.html so the root URL serves the notebook directly
          keep_files: false
